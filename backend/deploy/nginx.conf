# Can bang tai cho docker compose: /ws -> cac gateway (WebSocket), con lai -> cac api.
# Docker DNS tra ve IP cua TAT CA replica cua 1 service; nginx phan phoi luan phien.
worker_processes auto;
events { worker_connections 20000; }
http {
  resolver 127.0.0.11 valid=10s;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  upstream api_up { server api:3000; }
  upstream gw_up { server gateway:3000; }
  server {
    listen 80;
    client_max_body_size 2m;
    location /ws {
      proxy_pass http://gw_up;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 120s;
    }
    location / {
      proxy_pass http://api_up;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
