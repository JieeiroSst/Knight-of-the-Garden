services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hsvv
      POSTGRES_PASSWORD: hsvv_password
      POSTGRES_DB: hsvv
    volumes:
      - hsvv_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hsvv"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: postgres://hsvv:hsvv_password@db:5432/hsvv
      JWT_SECRET: doi-chuoi-nay-thanh-1-chuoi-bi-mat-dai-ngau-nhien-that
      JWT_EXPIRES_IN: 30d
    ports:
      - "3000:3000"

volumes:
  hsvv_pgdata:
