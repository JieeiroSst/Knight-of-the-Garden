services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hsvv
      POSTGRES_PASSWORD: hsvv_password
      POSTGRES_DB: hsvv
    volumes:
      - hsvv_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hsvv"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://hsvv:hsvv_password@db:5432/hsvv
      JWT_SECRET: doi-chuoi-nay-thanh-1-chuoi-bi-mat-dai-ngau-nhien-that
      JWT_EXPIRES_IN: 30d
      PG_POOL_MAX: 10
      PG_IDLE_TIMEOUT_MS: 30000
      PG_CONN_TIMEOUT_MS: 5000
      RATE_LIMIT_GENERAL: 120
      RATE_LIMIT_AUTH: 20
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  hsvv_pgdata:
